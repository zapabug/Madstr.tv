repository: https://github.com/zapabug/Madstr.tv
name: Juke⚡tr
summary: Your Nostr jukebox. Music, podcasts, radio, videos and a picture show from the people you follow.
description: |
  Juke⚡tr turns Nostr into a jukebox you can drive with a TV remote or a finger. A board of stickers opens
  straight into music, podcasts, radio, short or long videos, keep-watching, your own pictures and local files,
  with a picture show from the people you follow behind the music. Radio plays internet stations from Nostr and
  live shows from zap.stream, by the genres and countries you pick. Add RSS feeds and music folders, vote on
  what you hear, and log in with Amber or a bunker link to use your own follows. Plays in the background with
  lock-screen controls. Works on phones and on Android TV.
website: https://www.pleb.world/jukestr/
